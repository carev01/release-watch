[project]
name = "release-watch"
version = "0.1.0"
description = "Daily watch of vendor release notes and new product versions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "trafilatura>=2.0",
    "selectolax>=0.3.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "markdownify>=0.14",
    "markdown-it-py>=3.0",
    "pypdf>=5.0",
]

[project.scripts]
release-watch = "release_watch.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22", "pytest-asyncio>=0.25", "ruff>=0.17,<0.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Real defects (pyflakes, syntax/statement errors) and import order. Not style rewrites: the code catches broad
# exceptions on purpose (one broken page must not stop a run) and spells regex flags re.I / re.S.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the repo's alembic/ migrations folder
