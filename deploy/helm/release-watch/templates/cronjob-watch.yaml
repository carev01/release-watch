apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-watch
  labels: {{- include "rw.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.watch | quote }}
  timeZone: {{ .Values.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.cron.deadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "rw.labels" . | nindent 12 }}
            app.kubernetes.io/component: watch
        spec:
          restartPolicy: Never
          initContainers:
            - name: migrate
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["migrate"]
              envFrom: [{ configMapRef: { name: {{ .Release.Name }}-config } }]
              env: {{- include "rw.env" . | nindent 16 }}
          containers:
            - name: watch
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["watch"]
              envFrom: [{ configMapRef: { name: {{ .Release.Name }}-config } }]
              env: {{- include "rw.env" . | nindent 16 }}
              resources: {{- toYaml .Values.cron.resources | nindent 16 }}
