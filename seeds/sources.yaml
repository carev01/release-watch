- vendor: Cohesity
  product: DataProtect
  url: https://docs.cohesity.com/docs/dataprotect
  kind: index_page
  title: DataProtect documentation (current version in the page title)
  notes: 'Public page shell of a sign-in gate (never log in); its <title> names the current version ("DataProtect 7.5").
    Only one version shows, so a new version appears as the title changing. The old 7_5 release-notes PDF now redirects
    to /docs/dataprotect/7.5/.'
- vendor: HYCU
  product: R-Cloud Hybrid Cloud Edition
  url: https://support.hycu.com/api/v2/help_center/en-us/sections/115001018365/articles.json?per_page=100
  kind: index_page
  title: HYCU R-Cloud Hybrid Cloud Edition user documentation (help center API, one article per version)
  notes: 'Public Zendesk JSON. Titles like "R-Cloud Hybrid Cloud Edition 5.3.0"; the regex keeps x.y.z for this product
    name only (build numbers and the old HYCU for Enterprise Clouds 4.x are ignored).'
- vendor: Dell
  product: NetWorker
  url: https://www.dell.com/support/kbdoc/en-us/000250114/nvp-vproxy-version-information
  kind: index_page
  title: NetWorker vProxy version information (NetWorker releases)
  notes: 'No NetWorker hub lists all versions; this KB maps vProxy builds to NetWorker releases 19.10.0.0-19.14.0.1.
    The regex wants a two-digit major and four parts, so vProxy (4.4.0-21) and vSphere (9.0.1) numbers are skipped.
    www.dell.com needs the browser. A NetWorker release without a new vProxy build may not appear here.'
- vendor: Red Hat
  product: OADP
  url: https://access.redhat.com/product-life-cycles/api/v1/products?name=Red%20Hat%20OpenShift%20Container%20Platform
  kind: index_page
  title: Red Hat Product Life Cycle API - OpenShift Container Platform (JSON)
  notes: 'DocExtractor tracks OADP under the OpenShift docs version (5.0), so the OCP versions are the signal, not
    OADP''s own 1.x versions. Lists 5.0, 4.22, 4.21...'
- vendor: CloudAlly
  product: CloudAlly for MS 365
  url: https://support.cloudally.com/api/v2/help_center/en-us/articles/15811601232284.json
  kind: index_page
  title: Complete Microsoft 365 User Guide (help center API, "Current version" line)
  notes: 'The owner named this guide as where the version comes from. Its header reads "Current version: MS 365 26.2.1
    - May 2026". The HTML page is behind a Cloudflare challenge; the public Zendesk JSON is not.'
- vendor: Commvault
  product: CommCell Console
  url: https://documentation.commvault.com/11.46/software/header.html
  kind: index_page
  title: Commvault documentation version menu (11.46, 11.44, 11.42, 11.40, 2024e)
  notes: 'The docs top bar loads this header; its Versions menu lists every published version. Older versions'' headers
    are rebuilt too (11.40''s lists 11.46), so this URL keeps showing new versions. Year names like 2024e are skipped.'
