# 2 children from bundle RN.HTML.10.9 (newest version by lowest position), first "Release Notes for HPE Zerto Software 10.9.10", then 10.9.01;
# child = help-be page HTML (plain HTTP), .content-body holds the full text (What's New, Resolved Issues, Known Issues). No url_rewrite: help.zerto.com is JS-only
- url: "https://help-be.zerto.com/api/categories"
  follow:
    mode: entry
    pick: {type: json, items: "*.children[id=ReleaseNotes].subLinks", order_by: position, order: asc, title: linkText, capture: {field: route, regex: "/bundle/([^/]+)/"}, url_template: "https://help-be.zerto.com/api/bundle/{_1}/toc?language=enus"}
    newest: first
    then: {pick: {type: json, items: "*.childEntries", url: url, title: title}}
    child_selector: ".content-body"

