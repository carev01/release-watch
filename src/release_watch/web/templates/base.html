<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Release Watch</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 1200px; padding: 1rem 1.5rem; color: #1d2330; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.05rem; margin: 1.75rem 0 .4rem; border-bottom: 1px solid #d5d9e0; padding-bottom: .2rem; }
  h3 { font-size: .9rem; margin: .8rem 0 .3rem; color: #4a5263; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: .3rem .45rem; border-bottom: 1px solid #eceef2; vertical-align: top; text-align: left; }
  th { font-weight: 600; color: #4a5263; font-size: .8rem; }
  .muted { color: #6b7385; font-size: .85rem; }
  .url { word-break: break-all; font-size: .82rem; }
  .pill { display: inline-block; padding: 0 .45rem; border-radius: .6rem; font-size: .78rem; background: #eceef2; }
  .release_notes { background: #d9f2e1; } .not_release_notes { background: #f6dede; }
  .unsure { background: #fbefd0; } .blocked { background: #e3e0f5; }
  .bar { display: flex; gap: .5rem; align-items: center; margin: .4rem 0; }
  form.filters { display: flex; gap: .6rem; align-items: end; margin: .75rem 0; }
  button { padding: .25rem .7rem; }
  nav.top { display: flex; gap: 1rem; margin-bottom: .8rem; font-size: .9rem; }
  pre.verbatim { white-space: pre-wrap; background: #f6f7f9; padding: .8rem; border-radius: .3rem; font: 13px/1.45 ui-monospace, monospace; }
  .card { border: 1px solid #d5d9e0; border-left: 4px solid #5b5fc7; border-radius: .35rem; padding: .6rem .9rem; margin: .6rem 0; max-width: 900px; background: #fff; }
  .card .tb p { margin: .3rem 0; } .card .tb ul { margin: .3rem 0; padding-left: 1.3rem; }
  .card .subtle { color: #6b7385; font-style: italic; } .card .big { font-size: 1.1rem; }
  .card .actions { margin-top: .5rem; } .card a.action { display: inline-block; border: 1px solid #5b5fc7; border-radius: .3rem; padding: .15rem .6rem; text-decoration: none; }
  details > summary { cursor: pointer; margin: .4rem 0; }
</style>
</head>
<body>
<nav class="top"><a href="/">Review queue</a> · <a href="/needs-look">Needs a look ({{ needs_look_count() }})</a> · <a href="/notifications">Notifications</a></nav>
{% block body %}{% endblock %}
</body>
</html>
